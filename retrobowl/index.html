<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play Retro Bowl, an exciting arcade football game!">
    <meta name="keywords" content="Retro Bowl, arcade game, football, online games">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self';">

    <link rel="shortcut icon" href="../../images/ico.ico" type="image/x-icon">
    <title>Retro Bowl | Seraph</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7FN7LEVWXD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-7FN7LEVWXD');
    </script>

    <style>
        body {
            background: #316afc;
            color: #cccccc;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        canvas {
            image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
            margin: 0;
            padding: 0;
            border: 0;
            display: block;
        }

        div.gm4html5_div_class {
            margin: 0;
            padding: 0;
        }

        div.gm4html5_login {
            padding: 20px;
            position: absolute;
            border: 2px solid #000;
            background-color: #316afc;
            color: #00ff00;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .gm4html5_cancel_button, .gm4html5_login_button {
            display: inline-block;
        }

        div.gm4html5_login_header {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="Game loading screen" style="display: none;">
        <canvas id="canvas" width="853" height="480">
            <p>Your browser doesn't support HTML5 canvas. Please update your browser.</p>
        </canvas>
    </div>

    <script src="../../storage/js/cloak.js"></script>
    <script src="html5game/RetroBowl.js"></script>
    <script>
        // Resize canvas to fill the screen
        function resizeCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // Initialize canvas size and adjust on resize
        document.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        });

        // Full-screen toggle
        document.addEventListener('keydown', (event) => {
            if (event.key === 'f') {
                toggleFullScreen();
            }
        });

        function toggleFullScreen() {
            const canvas = document.getElementById('canvas');
            if (!document.fullscreenElement) {
                canvas.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Poki SDK initialization
        (function () {
            function fin(ok) {
                (function checkInit() {
                    const allowedHosts = ['localhost', 'poki.com', 'poki-gdn.com'];
                    const hostname = window.location.hostname;

                    if (!allowedHosts.some(host => hostname.endsWith(host))) {
                        window.location.href = atob('aHR0cHM6Ly9wb2tpLmNvbS9zaXRlbG9jaw==');
                    }
                })();

                window.PokiSDK_OK = ok;
                GameMaker_Init();
            }

            window.addEventListener('load', () => {
                window.PokiSDK_loadState = 0;
                if (window.PokiSDK) {
                    PokiSDK.init()
                        .then(() => fin(true))
                        .catch(() => fin(false));
                } else {
                    window.PokiSDK = null;
                    fin(false);
                }
            });
        })();
    </script>
</body>
</html>
