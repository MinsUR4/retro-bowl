  <title>Retro Bowl College</title>
  <style>
      html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
  }

  #gm4html5_div_id {
    margin: 0;
    padding: 0;
    border: 0;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }

  canvas {
    display: block;
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    image-rendering: pixelated;
    -webkit-touch-callout: none;
    -ms-touch-action: none;
    touch-action: none;
  }

  :-webkit-full-screen {
    width: 100%;
    height: 100%;
  }

  :-moz-full-screen {
    width: 100%;
    height: 100%;
  }

  :-ms-fullscreen {
    width: 100%;
    height: 100%;

</head>

<body>
  <div class="gm4html5_div_class" id="gm4html5_div_id">
    <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen"
      style="display:none;" />
    <canvas id="canvas" width="853" height="480"
      style="position: absolute; top: 50%; left: 50%; bottom: -50%; right: -50%; transform: translate(-50%, -50%);">
      <p>Your browser doesn't support HTML5 canvas.</p>
    </canvas>
  </div>
  <script type="text/javascript" src="html5game/RetroBowl.js?cachebust=1606201936"></script>
  <script src="patch/js/poki-sdk-v2.js"></script>
  <script>(function () {
      function fin(ok) {
        window.PokiSDK_OK = ok;
        GameMaker_Init();
      }
      window.addEventListener("load", function (_) {
        window.PokiSDK_loadState = 0;
        if (window.PokiSDK) {
          PokiSDK.init().then(function () {
            fin(true);
          }).catch(function () {
            fin(true);
          });
        } else {
          window.PokiSDK = null;
          fin(false);
        }
      });
    })();
  </script>
</body>
